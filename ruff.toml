target-version = "py312"
line-length = 100

# `templates/` is content, not devkit source. Its Python is linted by the ruff.toml
# it ships INTO each generated project (which carries the `scripts/**` allowances
# these files need), and its `.tmpl` files are not valid Python until rendered.
# Linting them here would enforce devkit's config on files that never run here.
exclude = ["templates"]

# Make that exclusion hold for explicitly-named paths too. By default `exclude` is
# only consulted while *walking* a directory, so a file passed on the command line is
# linted regardless — and the two things that lint devkit now do exactly that: the
# `lint-fix.py` PostToolUse hook passes the file just edited, and `lint-all.py
# --changed` passes the diff. Without this, editing `templates/core/scripts/notify.py`
# gets it checked under devkit's config (whose `scripts/**` allowances do not match
# that path, so T201 fires on intentional prints) and *reformatted* in place — devkit
# rewriting its own template content as a side effect of touching it.
force-exclude = true

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "T20", "N", "RUF"]

[lint.per-file-ignores]
# CLI / diagnostic tooling: terminal output (T201), terse loop vars (E741), long
# regex/format lines (E501) are idiomatic here. These scripts orchestrate trusted
# first-party tools (git, ruff, docker) via subprocess, so the bandit
# subprocess/partial-path/urlopen warnings (S603/S607/S310) are expected here.
"scripts/**/*.py" = ["T201", "E741", "E501", "S603", "S607", "S310"]
# Skill payload scripts (`.claude/skills/*/`) are CLI tools a skill shells out to and
# reads the stdout of, so printing is their entire interface — same allowances as
# `scripts/**`. Vendored via MANIFEST, so this config must match the one shipped in
# templates/core/ruff.toml.tmpl or adopters fail lint on a file they did not write.
".claude/skills/**/*.py" = ["T201", "E741", "E501", "S603", "S607", "S310"]
# Hook-script tests: asserts (S101), long lines, and hardcoded test passwords (S105).
"scripts/hooks/tests/**/*.py" = ["E501", "S101", "S105"]
# devkit's own tests (generator, registry, renderer) — same allowances, plus S603
# because some drive real `git` in a throwaway repo to test the git-backed helpers.
"tests/**/*.py" = ["E501", "S101", "S105", "S603", "S607"]

[format]
quote-style = "double"
