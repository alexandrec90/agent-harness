name: CI

# Test devkit in isolation: lint, the vendored hook-script tests, and devkit's own
# tests (the project generator, the port registry, the template renderer). Everything
# is stdlib-only, so no services or project scaffold are needed.
#
# The two test trees are deliberately separate. `scripts/hooks/tests/` ships into
# every consuming project via sync-harness.py's MANIFEST and must stay project-
# agnostic — it runs against whatever `.agent-harness.toml` it finds, so it may never
# assert one project's literal values. `tests/` is devkit-only and never vendored,
# which is what lets the generator grow without forcing a `--pull` in every consumer.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + hook-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1: `latest_devkit_tag()` shells out
          # to `git describe --tags`, which needs the tags *and* a history that
          # reaches them. Shallow, it returns None and the generator silently falls
          # back to FALLBACK_DEVKIT_REF — the exact staleness the tag tests exist to
          # catch, invisible on a runner that cannot see a tag at all.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        # mypy is here because `tests/` generates projects and runs their
        # `scripts/lint-all.py`. That script skips linters it cannot import, so
        # omitting mypy does not fail the job — it silently drops type-checking
        # from the probe projects, which is the coverage this job exists to give.
        run: pip install ruff pytest mypy
      - name: Lint
        run: ruff check .
      - name: Hook-script tests (vendored tier)
        run: pytest scripts/hooks/tests/ -q
      - name: devkit tests (generator, ports, renderer)
        run: pytest tests/ -q

  generated-project:
    name: A generated project is green on arrival
    runs-on: ubuntu-latest
    # The regression this exists for: the vendored hook tests once pinned carameli's
    # literal credentials and paths, so every generated project failed 12 of them on
    # its very first CI run. Rendering a project and running its suites here is the
    # only check that catches that class of coupling — devkit's own suite passes
    # precisely because devkit's manifest is the one being hard-coded against.
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the other job, and one more: the generator compares the
          # vendored harness against the pinned tag, which it can only do with the
          # tagged commits present. Shallow, that check degrades to a printed note.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # uv so the generator can produce the project's uv.lock. It degrades to a
      # warning without uv, so this also keeps the lock path itself under test.
      - run: pip install ruff pytest uv mypy
      - name: Configure git identity
        # The generator makes an initial commit; a bare runner has no identity, and
        # `git commit` fails with "Please tell me who you are" rather than anything
        # that points at the generator.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "devkit CI"
      - name: Generate a project of each shape and run its checks
        run: |
          set -euo pipefail
          for preset in bare service service-redis data fullstack; do
            name="probe_$(echo "$preset" | tr '-' '_')"
            echo "::group::$preset"
            rm -rf /tmp/gen && mkdir -p /tmp/gen
            python scripts/new-project.py "$name" \
              --preset "$preset" --parent /tmp/gen --no-remote --no-worktree --yes
            cd "/tmp/gen/$name"
            python -m pytest scripts/hooks/tests/ -q
            # The wrappers tasks.json and the generated PR gate actually invoke.
            # Running pytest/ruff directly misses how these call them.
            python scripts/run-tests.py
            python scripts/lint-all.py
            ruff check .
            AGENT_HARNESS_DIR="$GITHUB_WORKSPACE" python scripts/sync-harness.py --check
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done
