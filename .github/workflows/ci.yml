name: CI

# Test devkit in isolation: lint, the vendored hook-script tests, and devkit's own
# tests (the project generator, the port registry, the template renderer). Everything
# is stdlib-only, so no services or project scaffold are needed.
#
# The two test trees are deliberately separate. `scripts/hooks/tests/` ships into
# every consuming project via sync-devkit.py's MANIFEST and must stay project-
# agnostic — it runs against whatever `.devkit.toml` it finds, so it may never
# assert one project's literal values. `tests/` is devkit-only and never vendored,
# which is what lets the generator grow without forcing a `--pull` in every consumer.
on:
  push:
    branches: [main]
  pull_request:
  # Re-runnable by hand. Cheap to have, and the only way to re-gate a commit
  # whose run was cancelled by the concurrency rule below.
  workflow_dispatch:

# Least privilege. Every job here only reads the repo; the one workflow that needs
# more (dependabot-automerge.yml) declares it in its own file rather than relying on
# a permissive repo default reaching this one.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight run for that ref. Keyed on the ref, not
# the workflow alone, so a PR run (refs/pull/N/merge) and a main-branch run
# (refs/heads/main) never cancel each other.
#
# `cancel-in-progress` is deliberately conditional: cancelling a superseded PR run
# saves minutes on a commit nobody will merge, but cancelling a push-to-main run
# would throw away the only CI signal that commit will ever get — and the Dependabot
# merge job gates on `workflow_run.conclusion == 'success'`, which a cancelled run
# never reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint + hook-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1: `latest_devkit_tag()` shells out
          # to `git describe --tags`, which needs the tags *and* a history that
          # reaches them. Shallow, it returns None and the generator silently falls
          # back to FALLBACK_DEVKIT_REF — the exact staleness the tag tests exist to
          # catch, invisible on a runner that cannot see a tag at all.
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
      - name: Format
        # FIRST, and before anything that can rewrite a file: `lint-all.py` auto-fixes
        # by design, so running it earlier would repair drift and then report clean,
        # turning this gate into a no-op.
        #
        # MANIFEST files are vendored byte-identical, and every adopter runs
        # `ruff format` on edit (lint-fix.py) or in its lint job. An unformatted
        # file here is therefore rewritten downstream on first touch, and the
        # adopter's `sync-devkit.py --check` then reports drift it did not cause
        # — which is exactly how v0.4.0 shipped a 101-char line in
        # harness_config.py and broke Carameli's mirror-sync gate. `ruff check`
        # cannot catch it: `scripts/**` ignores E501 by design.
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Install actionlint
        # Fail loudly, no `|| true`: `lint-all.py` degrades a missing linter to a
        # terminal note by design, so a silently skipped install here would leave the
        # workflow files unchecked while the job still reported green for them —
        # exactly the inert gate `.claude/rules/engineering.md` forbids. Same
        # installer `.claude/hooks/session-start.sh` uses, so CI and a session check
        # the same way. NB the args are positional ([[VERSION] DIR]); it takes no -b.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin
      - name: Lint + typecheck via the wrapper devkit ships
        # Runs devkit's own `scripts/lint-all.py` — the entrypoint its Stop hook and
        # every generated PR gate invoke. Its unique contribution over the two steps
        # above is mypy; running it here also means the wrapper itself is exercised on
        # every push rather than only in whichever session last touched it.
        run: uv run python scripts/lint-all.py
      - name: Upload lint artifact
        # The filtered artifact, not the raw job log: a raw log buries the real error
        # under container-boot noise and wastes an agent's context.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-errors
          path: logs/lint-errors.log
      - name: Hook-script tests (vendored tier)
        run: uv run python -m pytest scripts/hooks/tests/ -q
      - name: devkit tests (generator, ports, renderer)
        # Via the wrapper, for the same dogfooding reason as the lint step: this is
        # what `run-tests.py` is for, and a broken wrapper should fail devkit's own CI
        # rather than surface first in a generated project.
        run: uv run python scripts/run-tests.py
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: logs/test-failures.log

  pre-commit:
    name: Pre-commit gate (the channel devkit publishes)
    runs-on: ubuntu-latest
    # Its own job: it clones pinned third-party hook repos and builds their isolated
    # environments, so it has a different failure mode (and a different cache) from the
    # lint job — and a network hiccup there should not read as a lint failure.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Run every hook over the whole repo
        # `--all-files`, not the staged diff: on a push there is no staged diff, and the
        # devkit-authored hooks (manifest validity, stdlib-only imports) are cheap enough
        # to run repo-wide every time.
        #
        # This is what keeps the published channel honest. `.pre-commit-hooks.yaml` is
        # consumed by *other* repos at a pinned rev, so a hook that is broken here is
        # broken for them at their next `autoupdate` — and nothing else in this repo would
        # execute these scripts the way pre-commit does (`language: script`, which needs
        # the executable bit and a working shebang).
        run: uv run pre-commit run --all-files --show-diff-on-failure

  generated-project:
    name: A generated project is green on arrival
    runs-on: ubuntu-latest
    # The regression this exists for: the vendored hook tests once pinned carameli's
    # literal credentials and paths, so every generated project failed 12 of them on
    # its very first CI run. Rendering a project and running its suites here is the
    # only check that catches that class of coupling — devkit's own suite passes
    # precisely because devkit's manifest is the one being hard-coded against.
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the other job, and one more: the generator compares the
          # vendored harness against the pinned tag, which it can only do with the
          # tagged commits present. Shallow, that check degrades to a printed note.
          fetch-depth: 0
      # Deliberately NOT `./.github/actions/setup-python-env`: that action syncs
      # devkit's own environment, and this job never runs devkit's suite. It needs the
      # bare tools on PATH so the *generated* projects can be linted and tested inside
      # their own trees. uv is here so the generator can produce each project's
      # uv.lock — it degrades to a warning without uv, so this keeps the lock path
      # itself under test rather than silently skipped.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff pytest uv mypy
      - name: Configure git identity
        # The generator makes an initial commit; a bare runner has no identity, and
        # `git commit` fails with "Please tell me who you are" rather than anything
        # that points at the generator.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "devkit CI"
      - name: Generate a project of each shape and run its checks
        run: |
          set -euo pipefail
          for preset in bare service service-redis data fullstack; do
            name="probe_$(echo "$preset" | tr '-' '_')"
            echo "::group::$preset"
            rm -rf /tmp/gen && mkdir -p /tmp/gen
            python scripts/new-project.py "$name" \
              --preset "$preset" --parent /tmp/gen --no-remote --no-worktree --yes
            cd "/tmp/gen/$name"
            python -m pytest scripts/hooks/tests/ -q
            # The wrappers tasks.json and the generated PR gate actually invoke.
            # Running pytest/ruff directly misses how these call them.
            python scripts/run-tests.py
            # BEFORE lint-all.py, which auto-fixes: a generated project must arrive
            # format-clean, or its ruff-format pre-commit hook rewrites files on the
            # owner's first run. devkit excludes templates/ from its own format check, so
            # this is the only place that drift can surface.
            ruff format --check .
            python scripts/lint-all.py
            ruff check .
            DEVKIT_DIR="$GITHUB_WORKSPACE" python scripts/sync-devkit.py --check
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done
